<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BioSync - Dynamic Biometric Music</title>
  <style>
    :root {
      --bg-color: #030712;
      --card-bg: #090d16;
      --container-bg: #030712;
      --accent-color: #38bdf8;
      --glow-color: rgba(56, 189, 248, 0.2);
      --text-muted: #94a3b8;
    }

    @keyframes bgPulseGlow {
      0% { box-shadow: inset 0 0 40px var(--glow-color); }
      50% { box-shadow: inset 0 0 120px var(--glow-color); }
      100% { box-shadow: inset 0 0 40px var(--glow-color); }
    }

    * {
      box-sizing: border-box;
    }

    body {
      background-color: var(--bg-color);
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 15px 0;
      overflow-x: hidden;
      position: relative;
      transition: background-color 0.8s ease;
      animation: bgPulseGlow 2.5s infinite ease-in-out;
    }

    .main-container {
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: center;
      gap: 25px;
      width: 95%;
      max-width: 1150px;
      margin: 0 auto;
    }

    .dashboard-card {
      position: relative;
      z-index: 10;
      background: var(--card-bg);
      border: 1px solid var(--accent-color);
      border-radius: 20px;
      flex: 1.2;
      width: 100%;
      max-width: 650px;
      padding: 24px;
      backdrop-filter: blur(14px);
      display: flex;
      flex-direction: column;
      gap: 16px;
      transition: all 0.8s ease;
      box-shadow: 0 10px 35px rgba(0,0,0,0.85);
    }

    .avatar-wrapper {
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      width: 100%;
      max-width: 360px;
      height: auto;
    }

    #kurisuCanvas {
      width: 100%;
      max-width: 340px;
      height: auto;
      aspect-ratio: 340 / 440;
      border-radius: 16px;
      filter: drop-shadow(0 0 15px var(--accent-color));
      transition: filter 0.8s ease;
      background: rgba(15, 23, 42, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .avatar-dialog-box {
      background: rgba(9, 13, 22, 0.95);
      border: 1px solid var(--accent-color);
      border-radius: 12px;
      padding: 10px 14px;
      font-size: 13px;
      font-weight: bold;
      color: #ffffff;
      text-align: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
      margin-bottom: 10px;
      width: 100%;
      min-height: 38px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.5s ease;
    }

    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--container-bg);
      padding: 12px 18px;
      border-radius: 12px;
      font-size: 13px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      transition: all 0.8s ease;
      flex-wrap: wrap;
      gap: 10px;
    }

    .status-badge {
      font-weight: bold;
      padding: 4px 8px;
      border-radius: 6px;
    }

    .status-live { color: #22c55e; background: rgba(34, 197, 94, 0.15); }
    .status-offline { color: #ef4444; background: rgba(239, 68, 68, 0.15); }

    .bpm-container {
      text-align: center;
      background: var(--container-bg);
      padding: 18px;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      transition: all 0.8s ease;
    }

    .bpm-value {
      font-size: 44px;
      font-weight: bold;
      color: var(--accent-color);
      margin: 2px 0;
      transition: color 0.5s ease;
    }

    .bpm-waiting {
      font-size: 18px;
      color: var(--text-muted);
    }

    .manual-bpm-box {
      margin-top: 10px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .manual-bpm-box input {
      width: 120px;
      text-align: center;
      font-size: 16px;
      padding: 8px 12px;
    }

    .info-panel {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      background: var(--container-bg);
      padding: 14px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      transition: all 0.8s ease;
    }

    .info-box {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .quote-box {
      grid-column: span 2;
      background: rgba(255, 255, 255, 0.03);
      border-left: 3px solid var(--accent-color);
      padding: 10px 14px;
      border-radius: 0 8px 8px 0;
      font-style: italic;
      font-size: 13px;
      color: #e2e8f0;
      line-height: 1.4;
      transition: all 0.5s ease;
    }

    .info-title {
      font-size: 11px;
      color: var(--text-muted);
      font-weight: bold;
      letter-spacing: 1px;
    }

    .info-value {
      font-size: 14px;
      font-weight: bold;
      color: var(--accent-color);
      transition: color 0.5s ease;
    }

    #ecgCanvas {
      background: rgba(0, 0, 0, 0.6);
      border-radius: 8px;
      width: 100%;
      height: 50px;
      margin-top: 6px;
    }

    .controls-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    label {
      font-size: 11px;
      color: var(--text-muted);
      font-weight: 700;
      letter-spacing: 1px;
    }

    select, input, button {
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      font-size: 13px;
      font-weight: bold;
      transition: all 0.5s ease;
      width: 100%;
    }

    select, input {
      background: var(--container-bg);
      color: #ffffff;
      outline: none;
    }

    .btn-submit {
      grid-column: span 2;
      background: var(--accent-color);
      color: #000000;
      font-size: 15px;
      cursor: pointer;
      margin-top: 4px;
      border: none;
      transition: all 0.3s ease;
    }

    .btn-submit:hover:not(:disabled) {
      filter: brightness(1.2);
    }

    /* POPUP MODAL STYLES */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(3, 7, 18, 0.85);
      backdrop-filter: blur(8px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 100;
    }

    .modal-card {
      background: var(--card-bg);
      border: 1px solid var(--accent-color);
      border-radius: 20px;
      padding: 24px;
      max-width: 450px;
      width: 90%;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.9);
      display: flex;
      flex-direction: column;
      gap: 16px;
      animation: modalFadeIn 0.3s ease;
    }

    @keyframes modalFadeIn {
      from { transform: scale(0.9); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .modal-quote {
      font-style: italic;
      font-size: 14px;
      color: #f1f5f9;
      line-height: 1.5;
      background: rgba(255, 255, 255, 0.05);
      padding: 14px;
      border-radius: 10px;
      border-left: 4px solid var(--accent-color);
    }

    .btn-breakup-toggle {
      background: rgba(236, 72, 153, 0.2);
      border: 1px solid #ec4899;
      color: #fbcfe8;
      cursor: pointer;
      font-size: 12px;
      padding: 8px 12px;
    }

    .btn-breakup-toggle:hover {
      background: rgba(236, 72, 153, 0.4);
    }

    .btn-modal-proceed {
      background: var(--accent-color);
      color: #000;
      border: none;
      font-size: 14px;
      cursor: pointer;
    }

    .btn-modal-proceed:disabled {
      background: #475569;
      color: #94a3b8;
      cursor: not-allowed;
    }

    /* MOBILE MEDIA QUERY */
    @media (max-width: 850px) {
      .main-container {
        flex-direction: column;
        padding: 10px;
        gap: 20px;
      }

      .dashboard-card {
        padding: 18px;
      }

      .header-bar {
        flex-direction: column;
        align-items: flex-start;
      }

      .info-panel {
        grid-template-columns: 1fr;
      }

      .quote-box {
        grid-column: span 1;
      }

      .controls-grid {
        grid-template-columns: 1fr;
      }

      .btn-submit {
        grid-column: span 1;
      }
    }
  </style>
</head>
<body>

<div class="main-container">

  <!-- DASHBOARD CARD -->
  <div class="dashboard-card" id="main-card">
    
    <div class="header-bar">
      <span>ESP32 SENSOR: <span id="esp-status-badge" class="status-badge status-offline">WAITING FOR ESP32</span></span>
      <div>
        <span style="color: var(--text-muted); margin-right: 6px;">INPUT MODE:</span>
        <select class="mode-select-header" id="input-mode-select" onchange="toggleInputMode()">
          <option value="manual" selected>Manual BPM Input</option>
          <option value="esp32">ESP32 Hardware Stream</option>
        </select>
      </div>
    </div>

    <div class="bpm-container">
      <div style="font-size: 11px; color: var(--text-muted); font-weight: bold; letter-spacing: 1.5px;">BIOMETRIC STREAM</div>
      
      <!-- ESP32 DISPLAY -->
      <div class="bpm-value" id="bpm-val-esp" style="display: none;">
        <span class="bpm-waiting">Touch ESP32 Sensor...</span>
      </div>
      
      <!-- MANUAL INPUT DISPLAY -->
      <div class="manual-bpm-box" id="manual-input-container">
        <label for="manual-bpm-field">ENTER BPM:</label>
        <input type="number" id="manual-bpm-field" placeholder="e.g. 75" min="30" max="250" oninput="updateAnalysis()" value="75">
      </div>

      <canvas id="ecgCanvas" width="600" height="50"></canvas>
    </div>

    <div class="info-panel">
      <div class="info-box">
        <span class="info-title">DETECTED MOOD STATE</span>
        <span class="info-value" id="detected-mood">Waiting for Data...</span>
      </div>
      <div class="info-box">
        <span class="info-title">RECOMMENDED GENRE</span>
        <span class="info-value" id="suggested-genre">Waiting for Selection...</span>
      </div>
      <div class="quote-box" id="dynamic-quote">
        "Awaiting biometric stream to generate neural advice..."
      </div>
    </div>

    <div class="controls-grid">
      <div class="form-group">
        <label for="lang-select">SELECT MUSIC LANGUAGE</label>
        <select id="lang-select" onchange="updateAnalysis()">
          <option value="Tamil">Tamil</option>
          <option value="International">International</option>
          <option value="Hindi">Hindi</option>
          <option value="Telugu">Telugu</option>
          <option value="Malayalam">Malayalam</option>
        </select>
      </div>

      <div class="form-group">
        <label for="target-mode">BIOMATCH TARGET MODE</label>
        <select id="target-mode" onchange="updateAnalysis()">
          <option value="maintain">Maintain My Mood</option>
          <option value="change">Change My Mood</option>
        </select>
      </div>

      <button id="rec-btn" class="btn-submit" onclick="openQuoteModal()">Open YouTube Music Recommendation →</button>
    </div>

  </div>

  <!-- CYBER FEMALE AI CANVAS AVATAR -->
  <div class="avatar-wrapper">
    <div class="avatar-dialog-box" id="kurisu-dialog">"Waiting for biometric pulse..."</div>
    <canvas id="kurisuCanvas" width="340" height="440"></canvas>
  </div>

</div>

<!-- POPUP MODAL -->
<div class="modal-overlay" id="quote-modal">
  <div class="modal-card">
    <div style="font-size: 11px; color: var(--text-muted); font-weight: bold; letter-spacing: 1px;">AI NEURAL ADVICE</div>
    <div class="modal-quote" id="modal-quote-text">Loading quote...</div>

    <button class="btn-breakup-toggle" id="breakup-toggle-btn" style="display: none;" onclick="enableBreakupMode()">
      💔 Feeling Heartbroken? Switch to Breakup Songs
    </button>

    <button class="btn-modal-proceed" id="modal-proceed-btn" disabled onclick="redirectToYouTube()">
      Please wait (5s)...
    </button>
  </div>
</div>

<script>
  // QUOTE POOLS (10 QUOTES EACH)
  const quotesPool = {
    calm: [
      '"A tranquil mind brings inner strength and self-confidence."',
      '"Peace comes from within. Do not seek it without."',
      '"Quiet the mind, and the soul will speak."',
      '"Calmness is the cradle of power."',
      '"In the silence of the heart, wisdom awakens."',
      '"Breathing in, I calm body and mind. Breathing out, I smile."',
      '"Serenity is not freedom from the storm, but peace amid the storm."',
      '"The mind should be like water—smooth, calm, and reflecting truth."',
      '"Slow down and everything you are chasing will come around and catch you."',
      '"A quiet pulse is a fortress against life\'s chaos."'
    ],
    highEnergy: [
      '"Channel that fiery pulse into relentless momentum. Do not break—dominate!"',
      '"Your energy defines your reality. Turn up the fire inside!"',
      '"Action is the foundational key to all success. Keep moving!"',
      '"Don\'t stop when you\'re tired. Stop when you\'re done."',
      '"The only limits that exist are the ones you build in your mind."',
      '"Turn your adrenaline into accomplishment."',
      '"Strength does not come from winning. Your struggles develop your strengths."',
      '"Push harder than yesterday if you want a better tomorrow."',
      '"Your heartbeat is the drumline to your own success story."',
      '"Seize the energy of this moment and conquer your goals."'
    ],
    extreme: [
      '"Pause immediately. Even the strongest engines overheat when driven endlessly."',
      '"Breathe deep. Stress is an illusion created by temporary overload."',
      '"Step back before you step over the line. Regain control."',
      '"In high-pressure moments, composure is your greatest weapon."',
      '"When storm winds rage, the wise tree bends instead of breaking."',
      '"Relax your shoulders, unclench your jaw. Control your pulse."',
      '"A rapid mind makes reckless choices. Pause and reset."',
      '"Take a step back. Chaos passes, but your wellness comes first."',
      '"Your heart is sending a signal: slow down and recalculate."',
      '"Mastering your breath is the first step to mastering your life."'
    ],
    breakup: [
      '"You\'re crying over someone who replaced you like a software update? Hit the gym and delete their number."',
      '"They lost someone who loved them; you lost someone who didn\'t value you. Who really lost?"',
      '"Stop checking their social media. You\'re inspecting garbage you already threw out."',
      '"Your heart rate spiked for someone who couldn\'t even reply to a text? Do better."',
      '"A breakup is just the universe\'s way of un-installing toxic malware from your life."',
      '"They aren\'t your soulmate, they were just a life lesson with good lighting."',
      '"Upgrade your playlist, upgrade your life, and let them remain a past mistake."',
      '"You missed them? Go do 20 pushups and drink water. You\'re just bored."',
      '"Why cry over spilled milk when you can build an empire instead?"',
      '"Love is grand, but self-respect is priceless. Wipe your eyes and level up."'
    ]
  };

  let isHardwareConnected = false;
  let espBpmValue = 0;
  let activeInputMode = "manual";
  let activeWaveColor = '#38bdf8';
  let activeCategory = "calm";
  let isBreakupOverride = false;
  let currentSelectedQuote = "";
  let modalTimer = null;

  // ECG Graph Logic
  const canvas = document.getElementById('ecgCanvas');
  const ctx = canvas.getContext('2d');
  let x = 0;

  function drawECG() {
    ctx.fillStyle = 'rgba(0, 0, 0, 0.2)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    
    ctx.beginPath();
    const activeState = (activeInputMode === 'esp32' && isHardwareConnected) || (activeInputMode === 'manual' && getActiveBPM() > 0);
    ctx.strokeStyle = activeState ? activeWaveColor : '#334155';
    ctx.lineWidth = 2;
    ctx.moveTo(x, canvas.height / 2);
    
    x += 4;
    if (x > canvas.width) x = 0;
    
    let y = canvas.height / 2;
    if (activeState && x % 60 > 25 && x % 60 < 35) {
      y += (Math.random() - 0.5) * 35;
    }
    
    ctx.lineTo(x, y);
    ctx.stroke();
    requestAnimationFrame(drawECG);
  }

  function toggleInputMode() {
    activeInputMode = document.getElementById('input-mode-select').value;
    const manualContainer = document.getElementById('manual-input-container');
    const espBpmDisplay = document.getElementById('bpm-val-esp');

    if (activeInputMode === 'manual') {
      manualContainer.style.display = 'flex';
      espBpmDisplay.style.display = 'none';
    } else {
      manualContainer.style.display = 'none';
      espBpmDisplay.style.display = 'block';
    }
    updateAnalysis();
  }

  function getActiveBPM() {
    if (activeInputMode === 'manual') {
      return parseInt(document.getElementById('manual-bpm-field').value) || 0;
    }
    return espBpmValue;
  }

  function getRandomQuote(category) {
    const pool = quotesPool[category] || quotesPool.calm;
    return pool[Math.floor(Math.random() * pool.length)];
  }

  async function pollESP32BPM() {
    try {
      const res = await fetch('/api/bpm');
      const data = await res.json();
      
      const badge = document.getElementById('esp-status-badge');
      const espBpmDisplay = document.getElementById('bpm-val-esp');

      if (data && data.connected && data.bpm > 0) {
        isHardwareConnected = true;
        espBpmValue = data.bpm;

        badge.className = 'status-badge status-live';
        badge.innerText = 'LIVE [GPIO 13]';

        if (activeInputMode === 'esp32') {
          espBpmDisplay.innerHTML = `${data.bpm} <span style="font-size: 20px;">BPM</span>`;
        }
      } else {
        isHardwareConnected = false;
        espBpmValue = 0;

        badge.className = 'status-badge status-offline';
        badge.innerText = 'WAITING FOR ESP32';

        if (activeInputMode === 'esp32') {
          espBpmDisplay.innerHTML = `<span class="bpm-waiting">Touch ESP32 Sensor...</span>`;
        }
      }
      updateAnalysis();
    } catch (err) {
      console.log("Polling error:", err);
    }
  }

  // FUTURISTIC FEMALE CYBER-AI RENDERER
  const kCanvas = document.getElementById('kurisuCanvas');
  const kCtx = kCanvas.getContext('2d');
  let frameCount = 0;

  function drawKurisu() {
    frameCount++;
    const w = kCanvas.width;
    const h = kCanvas.height;

    kCtx.clearRect(0, 0, w, h);

    const pulse = Math.sin(frameCount * 0.08) * 4;
    const headX = w / 2;
    const headY = 160 + Math.sin(frameCount * 0.04) * 3;

    // 1. Holographic Grid Background Ring
    kCtx.strokeStyle = activeWaveColor;
    kCtx.lineWidth = 1;
    kCtx.globalAlpha = 0.2;
    kCtx.beginPath();
    kCtx.arc(headX, headY, 130 + pulse, 0, Math.PI * 2);
    kCtx.stroke();
    kCtx.globalAlpha = 1.0;

    // 2. Cyber Shoulders & Bust
    const bodyGrad = kCtx.createLinearGradient(0, headY + 50, 0, h);
    bodyGrad.addColorStop(0, '#0f172a');
    bodyGrad.addColorStop(1, '#020617');

    kCtx.fillStyle = bodyGrad;
    kCtx.strokeStyle = activeWaveColor;
    kCtx.lineWidth = 2;

    kCtx.beginPath();
    kCtx.moveTo(headX - 100, h);
    kCtx.quadraticCurveTo(headX - 85, headY + 120, headX - 45, headY + 80);
    kCtx.lineTo(headX - 20, headY + 60);
    kCtx.lineTo(headX + 20, headY + 60);
    kCtx.lineTo(headX + 45, headY + 80);
    kCtx.quadraticCurveTo(headX + 85, headY + 120, headX + 100, h);
    kCtx.closePath();
    kCtx.fill();
    kCtx.stroke();

    // Chest Biometric Core
    kCtx.save();
    kCtx.shadowColor = activeWaveColor;
    kCtx.shadowBlur = 15;
    kCtx.strokeStyle = activeWaveColor;
    kCtx.lineWidth = 2.5;

    kCtx.beginPath();
    kCtx.moveTo(headX - 40, headY + 120);
    kCtx.lineTo(headX - 15, headY + 120);
    kCtx.lineTo(headX - 5, headY + 105 + pulse);
    kCtx.lineTo(headX + 5, headY + 135 - pulse);
    kCtx.lineTo(headX + 15, headY + 120);
    kCtx.lineTo(headX + 40, headY + 120);
    kCtx.stroke();
    kCtx.restore();

    // 3. Slender Cyber Neck
    kCtx.fillStyle = '#090d16';
    kCtx.fillRect(headX - 16, headY + 20, 32, 50);
    
    kCtx.strokeStyle = activeWaveColor;
    kCtx.lineWidth = 1.5;
    kCtx.beginPath();
    kCtx.moveTo(headX - 12, headY + 30);
    kCtx.lineTo(headX - 12, headY + 60);
    kCtx.moveTo(headX + 12, headY + 30);
    kCtx.lineTo(headX + 12, headY + 60);
    kCtx.stroke();

    // 4. Female Cyber Face Base
    kCtx.fillStyle = '#090d16';
    kCtx.beginPath();
    kCtx.moveTo(headX - 45, headY - 40);
    kCtx.quadraticCurveTo(headX - 45, headY + 20, headX - 18, headY + 50);
    kCtx.quadraticCurveTo(headX, headY + 62, headX + 18, headY + 50);
    kCtx.quadraticCurveTo(headX + 45, headY + 20, headX + 45, headY - 40);
    kCtx.quadraticCurveTo(headX, headY - 80, headX - 45, headY - 40);
    kCtx.fill();
    kCtx.stroke();

    // Head Visor
    kCtx.save();
    kCtx.shadowColor = activeWaveColor;
    kCtx.shadowBlur = 20;
    kCtx.fillStyle = activeWaveColor;
    
    kCtx.beginPath();
    kCtx.moveTo(headX - 44, headY - 12);
    kCtx.quadraticCurveTo(headX, headY - 2, headX + 44, headY - 12);
    kCtx.lineTo(headX + 40, headY + 8);
    kCtx.quadraticCurveTo(headX, headY + 18, headX - 40, headY + 8);
    kCtx.closePath();
    kCtx.fill();
    kCtx.restore();

    // Eye Glint
    kCtx.fillStyle = '#ffffff';
    kCtx.beginPath();
    kCtx.arc(headX - 18 + (pulse * 0.5), headY - 2, 3, 0, Math.PI * 2);
    kCtx.arc(headX + 18 + (pulse * 0.5), headY - 2, 3, 0, Math.PI * 2);
    kCtx.fill();

    // Lips Line
    kCtx.strokeStyle = activeWaveColor;
    kCtx.lineWidth = 2;
    kCtx.beginPath();
    kCtx.moveTo(headX - 8, headY + 35);
    kCtx.lineTo(headX + 8, headY + 35);
    kCtx.stroke();

    // 5. Crown Hair Geometry
    kCtx.strokeStyle = activeWaveColor;
    kCtx.lineWidth = 2;
    
    kCtx.beginPath();
    kCtx.moveTo(headX - 30, headY - 60);
    kCtx.lineTo(headX - 60, headY - 90);
    kCtx.lineTo(headX - 40, headY - 30);
    kCtx.stroke();

    kCtx.beginPath();
    kCtx.moveTo(headX + 30, headY - 60);
    kCtx.lineTo(headX + 60, headY - 90);
    kCtx.lineTo(headX + 40, headY - 30);
    kCtx.stroke();

    requestAnimationFrame(drawKurisu);
  }

  function applyDynamicTheme(bgColor, cardBg, containerBg, accentColor, glowColor, textMuted) {
    const root = document.documentElement;
    root.style.setProperty('--bg-color', bgColor);
    root.style.setProperty('--card-bg', cardBg);
    root.style.setProperty('--container-bg', containerBg);
    root.style.setProperty('--accent-color', accentColor);
    root.style.setProperty('--glow-color', glowColor);
    root.style.setProperty('--text-muted', textMuted);

    activeWaveColor = accentColor;
  }

  function setKurisuDialogue(text) {
    document.getElementById('kurisu-dialog').innerText = text;
  }

  function updateAnalysis() {
    const bpm = getActiveBPM();
    const targetMode = document.getElementById('target-mode').value;
    const lang = document.getElementById('lang-select').value;
    
    const moodEl = document.getElementById('detected-mood');
    const genreEl = document.getElementById('suggested-genre');
    const quoteEl = document.getElementById('dynamic-quote');

    if (!bpm || bpm <= 0) {
      applyDynamicTheme("#030712", "#090d16", "#030712", "#38bdf8", "rgba(56, 189, 248, 0.15)", "#64748b");
      setKurisuDialogue('"Awaiting biometric stream synchronization..."');
      moodEl.innerText = "Waiting for Data...";
      genreEl.innerText = "Waiting for Selection...";
      quoteEl.innerText = '"Awaiting biometric stream to generate neural advice..."';
      return;
    }

    let previousCategory = activeCategory;

    if (bpm < 55) {
      applyDynamicTheme("#140924", "#1b0c30", "#0e061a", "#c084fc", "rgba(192, 132, 252, 0.45)", "#e9d5ff");
      setKurisuDialogue('"Low pulse anomaly detected. Recommending ambient recovery audio."');
      moodEl.innerText = "Critically Low BPM (< 55)";
      genreEl.innerText = "Rest & Ambient Sounds";
      activeCategory = "calm";
    } else if (bpm >= 55 && bpm <= 82) {
      applyDynamicTheme("#031c14", "#062b1f", "#02120d", "#22c55e", "rgba(34, 197, 94, 0.4)", "#86efac");
      setKurisuDialogue('"Optimal biometric rhythm achieved. Core state stabilized."');
      moodEl.innerText = "Calm Baseline / Peaceful Vibe";
      activeCategory = "calm";
    } else if (bpm >= 83 && bpm <= 170) {
      applyDynamicTheme("#240909", "#360e0e", "#190505", "#f97316", "rgba(249, 115, 22, 0.45)", "#fdba74");
      setKurisuDialogue('"Elevated heart rate registered! Adjusting frequency output."');
      moodEl.innerText = "High Energy / Excited / Stressed";
      activeCategory = "highEnergy";
    } else {
      applyDynamicTheme("#330505", "#4a0808", "#240303", "#ef4444", "rgba(239, 68, 68, 0.5)", "#fca5a5");
      setKurisuDialogue('"Warning: Extreme BPM overload! Initiate immediate relaxation sequence."');
      moodEl.innerText = "BPM Too High (> 170 BPM)";
      genreEl.innerText = "Rest & Medical Caution";
      activeCategory = "extreme";
    }

    // Assign a quote ONLY if the category changes or if no quote was previously selected
    if (!currentSelectedQuote || previousCategory !== activeCategory) {
      isBreakupOverride = false;
      currentSelectedQuote = getRandomQuote(activeCategory);
    }

    quoteEl.innerText = currentSelectedQuote;

    let genreText = "";
    if (targetMode === "maintain") {
      if (bpm >= 55 && bpm <= 82) genreText = `${lang} Chill & Soft Hits`;
      else genreText = `${lang} Motivational Workout Tracks`;
    } else {
      if (bpm >= 55 && bpm <= 82) genreText = `${lang} Energetic Workout Tracks`;
      else genreText = `${lang} Deep Relaxation Melodies`;
    }

    genreEl.innerText = genreText;
  }

  // MODAL AND BREAKUP HANDLERS
  function openQuoteModal() {
    const modal = document.getElementById('quote-modal');
    const quoteText = document.getElementById('modal-quote-text');
    const breakupBtn = document.getElementById('breakup-toggle-btn');
    const proceedBtn = document.getElementById('modal-proceed-btn');

    quoteText.innerText = currentSelectedQuote;
    modal.style.display = 'flex';

    // Show Breakup option for BOTH Calm AND High Energy BPM modes
    if (activeCategory === "calm" || activeCategory === "highEnergy") {
      breakupBtn.style.display = 'inline-block';
    } else {
      breakupBtn.style.display = 'none';
    }

    // Start 5-second countdown lock
    proceedBtn.disabled = true;
    let timeLeft = 5;

    if (modalTimer) clearInterval(modalTimer);

    modalTimer = setInterval(() => {
      if (timeLeft > 0) {
        proceedBtn.innerText = `Preparing Youtube Stream (${timeLeft}s)...`;
        timeLeft--;
      } else {
        clearInterval(modalTimer);
        proceedBtn.innerText = "Launch YouTube Music Recommendation →";
        proceedBtn.disabled = false;
      }
    }, 1000);
  }

  function enableBreakupMode() {
    isBreakupOverride = true;
    activeCategory = "breakup";
    currentSelectedQuote = getRandomQuote("breakup");

    document.getElementById('modal-quote-text').innerText = currentSelectedQuote;
    document.getElementById('breakup-toggle-btn').style.display = 'none';
    setKurisuDialogue('"Switched to Heartbreak mode. Time for some harsh truth..."');
  }

  function redirectToYouTube() {
    const lang = document.getElementById('lang-select').value;
    const targetMode = document.getElementById('target-mode').value;
    const bpm = getActiveBPM();

    let query = `${lang} mood relaxation music`;

    if (isBreakupOverride) {
      query = `${lang} breakup emotional sad songs heartbreak music`;
    } else if (targetMode === "maintain") {
      if (bpm >= 55 && bpm <= 82) query = `${lang} chill relaxing love romantic songs`;
      else query = `${lang} motivational gym pump up songs`;
    } else {
      if (bpm >= 55 && bpm <= 82) query = `${lang} motivational gym pump up workout songs`;
      else query = `${lang} deep relaxation calm soothing melodies`;
    }

    document.getElementById('quote-modal').style.display = 'none';
    window.open(`https://music.youtube.com/search?q=${encodeURIComponent(query)}`, '_blank');
  }

  window.addEventListener('DOMContentLoaded', () => {
    drawECG();
    drawKurisu();
    toggleInputMode();
    setInterval(pollESP32BPM, 1000);
  });
</script>
